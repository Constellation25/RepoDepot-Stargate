<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kre8tive.Space - Live Build Feed</title>
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="/feed.xml">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:#0a0e27;color:#fff;min-height:100vh}
    .header{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);padding:40px 20px;text-align:center}
    h1{font-size:2.4rem;font-weight:900}
    .sub{opacity:.9;margin-top:8px}
    .wrap{max-width:1200px;margin:0 auto;padding:30px 16px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
    .card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px}
    .num{font-size:2rem;font-weight:900}
    .lbl{opacity:.7;margin-top:4px;font-size:.9rem}
    .grid{display:grid;gap:14px}
    .item{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:16px}
    .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .name{font-weight:900;font-size:1.2rem;color:#8aa1ff}
    .meta{opacity:.7;font-size:.9rem;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
    .desc{opacity:.85;margin-top:10px;line-height:1.5}
    .links{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
    a.btn{display:inline-block;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:800}
    .gh{background:rgba(255,255,255,.10);color:#fff}
    .live{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff}
    .rss{position:fixed;right:18px;bottom:18px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;
      padding:12px 16px;border-radius:999px;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <div class="header">
    <h1>🚀 Kre8tive.Space</h1>
    <div class="sub">Live Build Feed • Cloudflare Pages</div>
  </div>

  <div class="wrap">
    <div class="stats">
      <div class="card"><div class="num" id="totalProjects">—</div><div class="lbl">Total Projects</div></div>
      <div class="card"><div class="num" id="totalStars">—</div><div class="lbl">Total Stars</div></div>
      <div class="card"><div class="num" id="lastUpdate">—</div><div class="lbl">Last Update</div></div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <a class="rss" href="/feed.xml">📡 RSS</a>

  <script>
    fetch('/feed_database.json')
      .then(r => r.json())
      .then(data => {
        const projects = data.projects || [];
        document.getElementById('totalProjects').textContent = data.metadata?.total_projects ?? projects.length;
        document.getElementById('totalStars').textContent = projects.reduce((s,p)=>s+(p.stars||0),0);
        document.getElementById('lastUpdate').textContent = new Date().toLocaleString();

        const grid = document.getElementById('grid');
        grid.innerHTML = projects
          .sort((a,b)=> (b.stars||0)-(a.stars||0))
          .map(p => `
            <div class="item">
              <div class="top">
                <div>
                  <div class="name">${p.name}</div>
                  <div class="meta">
                    <span>⭐ ${p.stars}</span>
                    <span>🍴 ${p.forks}</span>
                    <span>🕒 ${new Date(p.last_pushed).toLocaleDateString()}</span>
                  </div>
                </div>
              </div>
              <div class="desc">${p.description || ''}</div>
              <div class="links">
                <a class="btn gh" href="${p.github_url}" target="_blank">💻 GitHub</a>
                <a class="btn live" href="${p.deploy_url}" target="_blank">🚀 Live</a>
              </div>
            </div>
          `).join('');
      })
      .catch(() => {
        document.getElementById('grid').innerHTML = '<div class="item">feed_database.json not found.</div>';
      });

    setInterval(()=>location.reload(), 60000);
  </script>
</body>
</html>
